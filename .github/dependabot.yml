# Keeps pinned dependencies current through reviewable pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
    commit-message:
      prefix: build
